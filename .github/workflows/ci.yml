name: ci

on:
  push:
    branches: "**"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: "**"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions: {}

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
          check-latest: true

      - name: Install Go modules
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Install just
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: just

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to v2.15.0 — built with go 1.26
          version: v2.15.0
          install-mode: binary
          skip-cache: false
          install-only: true

      - name: Install Go tools
        run: |
          # Pinned to gopls v0.23.0 — last release compatible with go 1.26 (v0.24.0 requires go 1.27)
          go install golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@v0.23.0

      - name: Run go modernize
        run: just modernize

      - name: Run golangci-lint
        run: just lint

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
          check-latest: true

      - name: Install Go modules
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Install just
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: just

      - name: Run test
        run: just test

  test-race:
    name: test-race
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
          check-latest: true

      - name: Install Go modules
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Install just
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: just

      - name: Run tests with race detector
        run: just test-race
